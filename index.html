<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thuni Kadai Manager</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182235;--muted:#6b7280;--line:#e5e9f1;--brand:#2457d6;--green:#13845b;--red:#c43d4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "Noto Sans Tamil",Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:#172b55;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header small{color:#d5def5}.wrap{display:flex;min-height:calc(100vh - 65px)}
nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:12px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;margin:3px 0;color:#34415b;cursor:pointer;font-size:14px}
nav button.active,nav button:hover{background:#eaf0ff;color:var(--brand);font-weight:700}
main{padding:22px;width:calc(100% - 220px);max-width:1500px;margin:auto}
h2{margin:0 0 16px;font-size:22px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 2px 8px #1b2b4b08}
.stat{font-size:25px;font-weight:750;margin-top:6px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}
button,.btn{border:0;border-radius:8px;background:var(--brand);color:white;padding:9px 13px;cursor:pointer;font-weight:600}
button.secondary{background:#e9eef8;color:#263957}button.danger{background:#fff0f1;color:var(--red)}button.good{background:var(--green)}
input,select,textarea{border:1px solid #d7deea;border-radius:8px;padding:10px;background:white;color:var(--ink);font:inherit;min-width:0}
input,select{height:39px}textarea{width:100%;min-height:70px}
.search{min-width:220px;flex:1}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:12px;color:#68758c;background:#f8faff}tr:hover td{background:#fbfcff}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#647089;font-weight:650}.field input,.field select{width:100%}
.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:3px 8px;border-radius:20px;background:#edf2ff;color:#2850ad;font-size:12px}.low{color:#c43d4d;font-weight:700}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.modal>div{background:white;border-radius:14px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.modal h3{margin:0 0 15px}.right{text-align:right}.notice{padding:11px 13px;background:#eef5ff;border-radius:9px;color:#36517d;margin:10px 0}.empty{text-align:center;padding:30px;color:#8993a5}.small{font-size:12px}.summaryline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
@media(max-width:850px){.wrap{display:block}nav{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}main{width:100%;padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.formgrid{grid-template-columns:1fr}.grid{gap:8px}.stat{font-size:20px}}
@media print{header,nav,.toolbar,.no-print{display:none!important}.wrap,main{display:block;width:100%;padding:0}.card{box-shadow:none}}
</style></head>
<body>
<header><div><h1>🧵 Thuni Kadai Manager</h1><small>துணிக்கடை மேலாண்மை • Offline Billing & Stock</small></div><div id="today"></div></header>
<div class="wrap"><nav id="nav">
<button class="active" data-page="dashboard">🏠 Dashboard</button><button data-page="billing">🧾 Sales / Billing</button><button data-page="products">👕 Products / Stock</button><button data-page="purchases">📦 Purchases</button><button data-page="customers">👥 Customers</button><button data-page="suppliers">🚚 Suppliers</button><button data-page="expenses">💸 Expenses</button><button data-page="reports">📊 Reports</button><button data-page="settings">⚙️ Settings & Backup</button>
</nav><main id="app"></main></div><div id="modalroot"></div>
<script>
const KEY='thuni_kadai_v1';
const blank=()=>({products:[],sales:[],purchases:[],customers:[],suppliers:[],expenses:[],settings:{shop:'Thuni Kadai',phone:'',address:'',currency:'₹',tax:0}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){db=blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const $=s=>document.querySelector(s), money=n=>(db.settings.currency||'₹')+Number(n||0).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function date(){return new Date().toISOString().slice(0,10)}
function page(p){$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,billing,products,purchases,customers,suppliers,expenses,reports,settings})[p]()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});
$('#today').textContent=new Date().toLocaleDateString();
function title(t,sub=''){return `<h2>${t}</h2>${sub?`<div class="muted">${sub}</div>`:''}`}
function stat(label,value,sub=''){return `<div class="card"><div class="muted">${label}</div><div class="stat">${value}</div><div class="small muted">${sub}</div></div>`}
function table(headers,rows){return `<div class="tablebox"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet / பதிவுகள் இல்லை</td></tr>`}</tbody></table></div>`}
function dashboard(){let todaySales=db.sales.filter(x=>x.date===date()).reduce((a,x)=>a+x.total,0),stock=db.products.reduce((a,x)=>a+Number(x.qty||0),0),low=db.products.filter(x=>x.qty<=x.min).length;$('#app').innerHTML=title('Dashboard / முகப்பு','உங்கள் கடையின் இன்றைய நிலை')+`<div class="grid">${stat('Today Sales / இன்றைய விற்பனை',money(todaySales))}${stat('Products / பொருட்கள்',db.products.length)}${stat('Stock Units / இருப்பு',stock)}${stat('Low Stock / குறைந்த இருப்பு',low)}</div><div class="grid">${stat('Total Customers',db.customers.length)}${stat('Total Bills',db.sales.length)}${stat('Purchases',db.purchases.length)}${stat('Expenses',money(db.expenses.reduce((a,x)=>a+x.amount,0)))}</div><div class="card"><h3>Low Stock Alert / குறைந்த இருப்பு எச்சரிக்கை</h3>${table(['Product','SKU','Size','Qty','Minimum'],db.products.filter(x=>x.qty<=x.min).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.size)}</td><td class="low">${x.qty}</td><td>${x.min}</td></tr>`).join(''))}</div>`}
function openModal(html){$('#modalroot').innerHTML=`<div class="modal" id="modal"><div>${html}<div class="toolbar right"><button class="secondary" onclick="closeModal()">Cancel / ரத்து</button></div></div></div>`}
function closeModal(){$('#modalroot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function products(){let rows=db.products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.category)}</td><td>${esc(x.size)}</td><td>${esc(x.color)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td><div class="actions"><button class="secondary" onclick="editProduct('${x.id}')">Edit</button><button class="danger" onclick="del('products','${x.id}')">Delete</button></div></td></tr>`).join('');$('#app').innerHTML=title('Products & Stock / பொருட்கள் மற்றும் இருப்பு')+`<div class="toolbar"><input class="search" id="ps" placeholder="Search product / SKU / size"><button onclick="productForm()">+ Add Product</button><button class="secondary" onclick="csv('products')">Export CSV</button></div><div id="pt">${table(['Product','SKU','Category','Size','Color','Qty','Cost','Selling','Actions'],rows)}</div>`;$('#ps').oninput=()=>{$('#pt').innerHTML=table(['Product','SKU','Category','Size','Color','Qty','Cost','Selling','Actions'],db.products.filter(x=>(x.name+x.sku+x.size+x.color+x.category).toLowerCase().includes($('#ps').value.toLowerCase())).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.category)}</td><td>${esc(x.size)}</td><td>${esc(x.color)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td><div class="actions"><button class="secondary" onclick="editProduct('${x.id}')">Edit</button><button class="danger" onclick="del('products','${x.id}')">Delete</button></div></td></tr>`).join(''))}}
function productForm(x={}){openModal(`<h3>${x.id?'Edit':'Add'} Product / பொருள்</h3><form id="pf"><div class="formgrid">${field('Product name / பெயர்','name',x.name)}${field('SKU / Code','sku',x.sku)}${field('Category / வகை','category',x.category)}${field('Size','size',x.size)}${field('Color','color',x.color)}${field('Brand','brand',x.brand)}${field('Quantity / எண்ணிக்கை','qty',x.qty??0,'number','min="0" step="1"')}${field('Minimum stock','min',x.min??2,'number','min="0"')}${field('Cost price / கொள்முதல்','cost',x.cost??0,'number','min="0" step="0.01"')}${field('Selling price / விற்பனை','price',x.price??0,'number','min="0" step="0.01"')}</div><div class="toolbar"><button>Save Product</button></div></form>`);$('#pf').onsubmit=e=>{e.preventDefault();let d=formData(e.target);['qty','min','cost','price'].forEach(k=>d[k]=Number(d[k]));if(x.id)Object.assign(x,d);else db.products.push({id:id(),...d});save();closeModal();products()}}
function editProduct(i){productForm(db.products.find(x=>x.id===i))}
function del(arr,i){if(confirm('Delete this record?')){db[arr]=db[arr].filter(x=>x.id!==i);save();page(currentPage)}}
let currentPage='dashboard';const oldPage=page;page=function(p){currentPage=p;oldPage(p)};
function customers(){simpleList('customers','Customers / வாடிக்கையாளர்கள்',['name','phone','email','address'],['Name','Phone','Email','Address'])}
function suppliers(){simpleList('suppliers','Suppliers / விநியோகஸ்தர்கள்',['name','phone','email','address'],['Name','Phone','Email','Address'])}
function simpleList(key,heading,fields,labels){let rows=db[key].map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f])}</td>`).join('')}<td><div class="actions"><button class="secondary" onclick="simpleForm('${key}','${x.id}')">Edit</button><button class="danger" onclick="del('${key}','${x.id}')">Delete</button></div></td></tr>`).join('');$('#app').innerHTML=title(heading)+`<div class="toolbar"><input class="search" id="ss" placeholder="Search..."><button onclick="simpleForm('${key}')">+ Add New</button><button class="secondary" onclick="csv('${key}')">Export CSV</button></div><div id="st">${table([...labels,'Actions'],rows)}</div>`;$('#ss').oninput=()=>{$('#st').innerHTML=table([...labels,'Actions'],db[key].filter(x=>fields.some(f=>String(x[f]||'').toLowerCase().includes($('#ss').value.toLowerCase()))).map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f])}</td>`).join('')}<td><div class="actions"><button class="secondary" onclick="simpleForm('${key}','${x.id}')">Edit</button><button class="danger" onclick="del('${key}','${x.id}')">Delete</button></div></td></tr>`).join(''))}}
function simpleForm(key,i){let x=db[key].find(a=>a.id===i)||{};openModal(`<h3>${key==='customers'?'Customer':'Supplier'}</h3><form id="sf"><div class="formgrid">${field('Name','name',x.name)}${field('Phone','phone',x.phone)}${field('Email','email',x.email,'email')}${field('Address','address',x.address)}</div><div class="toolbar"><button>Save</button></div></form>`);$('#sf').onsubmit=e=>{e.preventDefault();let d=formData(e.target);if(x.id)Object.assign(x,d);else db[key].push({id:id(),...d});save();closeModal();simpleList(key,key==='customers'?'Customers / வாடிக்கையாளர்கள்':'Suppliers / விநியோகஸ்தர்கள்', ['name','phone','email','address'],['Name','Phone','Email','Address'])}}
function billing(){let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.size||'-')}/${esc(p.color||'-')}) — ${money(p.price)} | Stock ${p.qty}</option>`).join('');$('#app').innerHTML=title('Sales / Billing','Create invoice • விற்பனை ரசீது')+`<div class="card"><div class="formgrid">${field('Customer name','customer','Walk-in Customer')}${field('Phone','phone')}${field('Bill date','billdate',date(),'date')}</div><div class="toolbar"><select id="billprod" class="search"><option value="">Select product</option>${opts}</select><input id="billqty" type="number" min="1" value="1" style="width:90px"><button onclick="addBillItem()">Add item</button></div><div id="billitems">${table(['Product','Size / Color','Qty','Rate','Amount','Remove'],'')}</div><div style="max-width:360px;margin-left:auto"><div class="summaryline"><span>Subtotal</span><b id="subtotal">₹0.00</b></div><div class="summaryline"><span>Discount</span><input id="discount" type="number" value="0" min="0" style="width:110px"></div><div class="summaryline"><span>Tax (%)</span><input id="tax" type="number" value="${db.settings.tax||0}" min="0" style="width:110px"></div><div class="summaryline"><b>Total</b><b id="grand">₹0.00</b></div><div class="summaryline"><span>Paid</span><input id="paid" type="number" value="0" min="0" style="width:110px"></div><div class="summaryline"><span>Balance</span><b id="balance">₹0.00</b></div><div class="toolbar"><button class="good" onclick="saveBill()">Save Bill & Print</button></div></div></div><h3>Recent Bills</h3>${table(['Invoice','Date','Customer','Total','Paid','Balance'],db.sales.slice(-10).reverse().map(s=>`<tr><td>${s.invoice}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.total-s.paid)}</td></tr>`).join(''))}`;
window.billCart=[];$('#discount').oninput=calcBill;$('#tax').oninput=calcBill;$('#paid').oninput=calcBill}
function addBillItem(){let p=db.products.find(x=>x.id===$('#billprod').value),q=Number($('#billqty').value);if(!p||q<1)return alert('Select product and quantity');if(q>p.qty)return alert('Not enough stock');let old=window.billCart.find(x=>x.pid===p.id);if(old){if(old.qty+q>p.qty)return alert('Not enough stock');old.qty+=q}else window.billCart.push({pid:p.id,name:p.name,size:p.size,color:p.color,qty:q,price:p.price});renderCart()}
function renderCart(){let rows=window.billCart.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.size)} / ${esc(x.color)}</td><td><input type="number" min="1" max="${db.products.find(p=>p.id===x.pid)?.qty||x.qty}" value="${x.qty}" style="width:70px" onchange="changeCart(${i},this.value)"></td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="danger" onclick="window.billCart.splice(${i},1);renderCart()">×</button></td></tr>`).join('');$('#billitems').innerHTML=table(['Product','Size / Color','Qty','Rate','Amount','Remove'],rows);calcBill()}
function changeCart(i,v){let q=Number(v),p=db.products.find(x=>x.id===window.billCart[i].pid);if(q<1||q>p.qty){alert('Invalid quantity');return renderCart()}window.billCart[i].qty=q;renderCart()}
function calcBill(){let sub=(window.billCart||[]).reduce((a,x)=>a+x.qty*x.price,0),disc=Number($('#discount')?.value||0),tax=Number($('#tax')?.value||0),total=Math.max(0,(sub-disc)*(1+tax/100)),paid=Number($('#paid')?.value||0);if($('#subtotal'))$('#subtotal').textContent=money(sub);if($('#grand'))$('#grand').textContent=money(total);if($('#balance'))$('#balance').textContent=money(total-paid);window.billTotal=total}
function saveBill(){if(!window.billCart.length)return alert('Add at least one item');let total=window.billTotal,paid=Number($('#paid').value||0);if(paid>total)return alert('Paid amount exceeds total');let s={id:id(),invoice:'TK-'+Date.now().toString().slice(-7),date:$('#billdate').value,customer:$('#customer').value,phone:$('#phone').value,items:window.billCart.map(x=>({...x})),subtotal:window.billCart.reduce((a,x)=>a+x.qty*x.price,0),discount:Number($('#discount').value),tax:Number($('#tax').value),total,paid};s.items.forEach(x=>{let p=db.products.find(p=>p.id===x.pid);p.qty-=x.qty});db.sales.push(s);save();window.billCart=[];billing();printBill(s)}
function printBill(s){let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print invoice');return}w.document.write(`<html><head><title>${s.invoice}</title><style>body{font:14px Arial;padding:25px}h2{text-align:center}.line{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #ddd}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h2>${esc(db.settings.shop)}</h2><center>${esc(db.settings.address)}<br>${esc(db.settings.phone)}</center><hr><p>Invoice: ${s.invoice} | Date: ${s.date}<br>Customer: ${esc(s.customer)} | ${esc(s.phone)}</p><table><tr><th>Item</th><th>Size/Color</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${s.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.size)} / ${esc(x.color)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="line"><b>Subtotal</b>${money(s.subtotal)}</div><div class="line">Discount ${money(s.discount)}</div><div class="line">Tax ${s.tax}%</div><div class="line"><b>Total</b><b>${money(s.total)}</b></div><div class="line">Paid ${money(s.paid)}</div><div class="line">Balance ${money(s.total-s.paid)}</div><center><p>Thank you! மீண்டும் வருக!</p></center><script>window.print()<\/script></body></html>`);w.document.close()}
function purchases(){let rows=db.purchases.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.supplier)}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.qty*x.cost)}</td></tr>`).join('');$('#app').innerHTML=title('Purchases / கொள்முதல்')+`<div class="toolbar"><button onclick="purchaseForm()">+ Record Purchase</button><button class="secondary" onclick="csv('purchases')">Export CSV</button></div>${table(['Date','Supplier','Product','Qty','Unit Cost','Total'],rows)}`}
function purchaseForm(){openModal(`<h3>Record Purchase</h3><form id="buyf"><div class="formgrid">${field('Date','date',date(),'date')}<div class="field"><label>Product</label><select name="pid">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.size)})</option>`).join('')}</select></div>${field('Supplier','supplier')}${field('Quantity','qty',1,'number','min="1"')}${field('Unit cost','cost',0,'number','min="0" step="0.01"')}</div><div class="toolbar"><button>Save Purchase & Add Stock</button></div></form>`);$('#buyf').onsubmit=e=>{e.preventDefault();let d=formData(e.target),p=db.products.find(x=>x.id===d.pid);if(!p)return alert('Add a product first');d.qty=Number(d.qty);d.cost=Number(d.cost);p.qty+=d.qty;p.cost=d.cost;db.purchases.push({id:id(),date:d.date,supplier:d.supplier,product:p.name,qty:d.qty,cost:d.cost});save();closeModal();purchases()}}
function expenses(){let rows=db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td>${money(x.amount)}</td><td><button class="danger" onclick="del('expenses','${x.id}')">Delete</button></td></tr>`).join('');$('#app').innerHTML=title('Expenses / செலவுகள்')+`<div class="toolbar"><button onclick="expenseForm()">+ Add Expense</button></div>${table(['Date','Category','Note','Amount','Actions'],rows)}`}
function expenseForm(){openModal(`<h3>Add Expense</h3><form id="ef"><div class="formgrid">${field('Date','date',date(),'date')}${field('Category','category','Rent')}${field('Note','note')}${field('Amount','amount',0,'number','min="0" step="0.01"')}</div><div class="toolbar"><button>Save Expense</button></div></form>`);$('#ef').onsubmit=e=>{e.preventDefault();let d=formData(e.target);d.amount=Number(d.amount);db.expenses.push({id:id(),...d});save();closeModal();expenses()}}
function reports(){let sales=db.sales.reduce((a,x)=>a+x.total,0),cost=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty*(db.products.find(p=>p.id===i.pid)?.cost||0),0),0),exp=db.expenses.reduce((a,x)=>a+x.amount,0);$('#app').innerHTML=title('Reports / அறிக்கைகள்')+`<div class="grid">${stat('Total Sales',money(sales))}${stat('Estimated Cost of Goods',money(cost))}${stat('Gross Profit (approx.)',money(sales-cost))}${stat('Expenses',money(exp))}</div><div class="toolbar"><button class="secondary" onclick="csv('sales')">Export Sales CSV</button><button class="secondary" onclick="csv('products')">Export Stock CSV</button><button class="secondary" onclick="window.print()">Print Report</button></div><h3>Sales History</h3>${table(['Invoice','Date','Customer','Items','Total','Paid','Balance'],db.sales.slice().reverse().map(s=>`<tr><td>${s.invoice}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${s.items.reduce((a,x)=>a+x.qty,0)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.total-s.paid)}</td></tr>`).join(''))}<div class="notice">Profit is an estimate based on current product cost. Update cost prices accurately for better reports.</div>`}
function settings(){let s=db.settings;$('#app').innerHTML=title('Settings & Backup / அமைப்புகள்')+`<div class="card"><h3>Shop Details</h3><form id="setf"><div class="formgrid">${field('Shop name','shop',s.shop)}${field('Phone','phone',s.phone)}${field('Currency symbol','currency',s.currency)}${field('Default tax (%)','tax',s.tax,'number')}</div><div class="field" style="margin-top:10px"><label>Address</label><textarea name="address">${esc(s.address)}</textarea></div><div class="toolbar"><button>Save Settings</button></div></form></div><div class="card" style="margin-top:14px"><h3>Backup & Restore</h3><p class="muted">Your data stays in this browser on this computer. Take regular backups.</p><div class="toolbar"><button onclick="backup()">Download Full Backup</button><label class="btn secondary">Restore Backup<input type="file" id="restore" accept=".json,application/json" hidden></label><button class="danger" onclick="if(confirm('Delete ALL app data?')){db=blank();save();settings()}">Clear All Data</button></div></div><div class="notice">Offline app: no account or internet required. Do not clear Chrome data unless you have a backup.</div>`;$('#setf').onsubmit=e=>{e.preventDefault();Object.assign(db.settings,formData(e.target));db.settings.tax=Number(db.settings.tax);save();alert('Settings saved')};$('#restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.products||!v.sales)throw 0;db=v;save();alert('Backup restored');settings()}catch{alert('Invalid backup file')}};r.readAsText(f)}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ThuniKadai-Backup-'+date()+'.json';a.click();URL.revokeObjectURL(a.href)}
function csv(key){let arr=db[key]||[];if(!arr.length)return alert('No data to export');let cols=Object.keys(arr[0]),txt=[cols.join(','),...arr.map(o=>cols.map(k=>'"'+String(typeof o[k]==='object'?JSON.stringify(o[k]):o[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));a.download=key+'-'+date()+'.csv';a.click();URL.revokeObjectURL(a.href)}
dashboard();
</script></body></html>
